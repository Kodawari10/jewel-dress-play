<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --ivory:#fbf6ef; --cream:#f6ece4; --blush:#f2d9d9; --champ:#e8d5b9; --gold:#b98d3e; --gold2:#e2c27d;
  --plum:#3b2440; --ink:#3a2a33; --muted:#86727c; --card:#fffdf9; --line:#ead9c8; --ok:#4f8a6b;
  --serif:"Fredoka","Baloo 2","Quicksand","Varela Round","Arial Rounded MT Bold","Hiragino Maru Gothic ProN",ui-rounded,"Nunito",system-ui,sans-serif;
  --sans:"Nunito","Quicksand",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --shadow:0 10px 30px rgba(59,36,64,.12),0 2px 6px rgba(59,36,64,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{font-family:var(--sans);color:var(--ink);background:
  radial-gradient(1200px 600px at 10% -10%,#fff 0,rgba(255,255,255,0) 60%),
  radial-gradient(900px 700px at 110% 10%,#f5dfe3 0,rgba(245,223,227,0) 55%),
  linear-gradient(180deg,#fbf6ef,#f3e7dd);
  min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
button,.btn,.chip,.pill,.opt-label,.tag,.seg button{font-family:var(--serif)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));background:rgba(251,246,239,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;font-weight:700;color:var(--plum);cursor:pointer;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pill b{color:var(--plum)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;min-width:38px;height:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.iconbtn:hover{border-color:var(--gold2)}
.btn{border:none;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,#3b2440,#6b3d63);color:#fff;border:none}
.btn.gold{background:linear-gradient(135deg,#d9b56c,#b98d3e);color:#fff;border:none}
.btn.small{padding:7px 13px;font-size:13px}
.btn.surprise{display:block;width:100%;margin:2px 0 10px}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
main{max-width:1280px;margin:0 auto;padding:14px}
.screen{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- menu ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;min-height:calc(100vh - 110px)}
.hero h1{font-size:clamp(40px,6vw,72px);line-height:1;color:var(--plum)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:520px;line-height:1.5}
.gemday{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin-top:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px;cursor:pointer;transition:transform .15s, box-shadow .15s}.gemday:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.gemday .gd-gem{width:52px;height:52px;flex:none}.gemday .gd-gem svg{width:100%;height:100%}.gemday .gd-txt{flex:1;min-width:0}.gemday .gd-name{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--plum)}.gemday .gd-more{font-size:13px;color:var(--gold);font-weight:700;white-space:nowrap}
.msmenu{max-width:560px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}.msmenu .progress{margin:6px 0 4px}.progress i{background:linear-gradient(90deg,#f2a7c3,#e2c27d)}
.menu-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;max-width:560px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .15s, box-shadow .15s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mcard .t{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--plum)}
.mcard .d{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.mcard.feature{grid-column:1/-1;background:linear-gradient(135deg,#3b2440,#7a4670);color:#fff;border:none;position:relative;overflow:hidden}
.mcard.feature .t{color:#fff;font-size:26px}.mcard.feature .d{color:#f1dbe8;font-size:14px}
.mcard.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 4s infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.hero-art{display:flex;justify-content:center}
.hero-art svg{width:min(400px,90%);height:auto;border-radius:28px;filter:drop-shadow(0 20px 30px rgba(59,36,64,.18))}
/* ---------- play layout ---------- */
.play{display:grid;grid-template-columns:300px 1fr 300px;gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.panel h3{font-size:20px;color:var(--plum);margin-bottom:8px}
.stagewrap{position:relative;background:radial-gradient(70% 60% at 50% 35%,#fff 0,#f7ede6 60%,#efe1d6 100%);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 60px rgba(185,141,62,.08)}
.stagewrap svg.stage{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.stage-hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.stage-hud > *{pointer-events:auto}
.tag{background:rgba(255,253,249,.88);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;backdrop-filter:blur(6px)}
.mirrortag{font:inherit;font-size:13px;color:inherit;cursor:pointer;transition:background .2s,color .2s}
.mirrortag[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.progress{height:8px;background:#efe3d8;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e2c27d,#b98d3e);border-radius:99px;transition:width .4s}
.muted{color:var(--muted)} .small{font-size:13px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:min(52vh,480px);overflow-y:auto;padding:2px 4px 2px 2px;overscroll-behavior:contain;scrollbar-width:thin}
.gemchip{position:relative;border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.1;text-align:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.gemchip svg{width:42px;height:42px;pointer-events:none}
.gemchip.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(185,141,62,.35)}
.gemchip .info{position:absolute;top:2px;right:3px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;line-height:16px;padding:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:7px 11px;font-size:13px}
.seg button.on{background:var(--plum);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
#partSeg{display:flex;margin:4px 0 8px}#partSeg button{flex:1;padding:7px 4px}
.fabchips .chip{font-size:12px;padding:5px 9px}
.fabinfo{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin:0 0 12px}
.fabinfo .fabsw{width:76px;height:38px;flex:none;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.fabinfo p{margin:3px 0 0;line-height:1.35}
.cutseg{display:flex;flex-wrap:wrap;border-radius:14px;margin:4px 0 10px}
.cutseg button{display:flex;flex-direction:column;align-items:center;padding:5px 6px;font-size:10.5px;min-width:52px}
.cutseg .cutic{width:28px;height:28px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.opt-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:4px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--gold)}
input[type=color]{width:34px;height:34px;border:none;background:none;padding:0}
input[type=text]{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-weight:600}
.tabs button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.ghost{position:fixed;z-index:100;pointer-events:none;width:56px;height:56px;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.spot{cursor:pointer}
/* ---------- encyclopedia & gallery ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ecard{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;text-align:center;transition:transform .15s, box-shadow .15s}
.ecard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ecard svg{width:96px;height:96px}
.ecard .n{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--plum)}
.ecard.locked{opacity:.65}
.ecard[hidden]{display:none}
.ecard{position:relative}.ecard .favmark{display:none;position:absolute;top:8px;right:10px;font-size:18px;color:#e0567f;line-height:1}.ecard.fav .favmark{display:block}
.favbtn{margin-left:8px;vertical-align:middle}.favbtn[aria-pressed="true"]{background:#fde3ec;border-color:#e0567f;color:#b8325b}
.booktools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.booksort{display:inline-flex;align-items:center;gap:6px}
.booksort select{font:inherit;color:var(--plum);border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;cursor:pointer}
.ecard .mh{display:none;color:var(--plum);font-weight:600;margin-top:2px}
.grid.sort-hard .ecard .mh{display:block}
.booktools input[type=search]{font:inherit;border:1px solid var(--line);border-radius:999px;padding:9px 15px;flex:1 1 240px;max-width:420px;background:#fff}
.ecard.locked svg{filter:grayscale(1) brightness(.6) contrast(.6);opacity:.35}
.gcard{border:1px solid var(--line);background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.gcard .thumb{background:radial-gradient(70% 60% at 50% 35%,#fff 0,#f2e6dc 100%);}
.gcard .thumb svg{display:block;width:100%;height:auto}
.gcard .meta{padding:10px 12px}
.gcard .meta .n{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--plum)}
.gcard .acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.section-head h2{font-size:34px;color:var(--plum)}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,26,46,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s}
.sheet{background:var(--card);border-radius:22px;max-width:920px;width:100%;max-height:calc(100vh - 28px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative}
.sheet .close{position:absolute;right:12px;top:12px;z-index:2}
.infocard{display:grid;grid-template-columns:300px 1fr;gap:0}
.infocard .gemside{background:radial-gradient(80% 70% at 50% 40%,#fff 0,#f3e8de 70%,#e9dacb 100%);padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:22px 0 0 22px}
.infocard .gemside svg{width:230px;height:230px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.18))}
.infocard .body{padding:24px 24px 20px}
.infonav{display:flex;align-items:center;gap:10px;margin-top:4px}.infonav span{min-width:56px;text-align:center}
.infocard h2{font-size:38px;color:var(--plum);line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:14px 0;font-size:14px;line-height:1.45}
.kv dt{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.mohs{display:flex;gap:3px;align-items:center}
.bstone{display:inline-block;font-weight:700;background:#fdf1e4;border:1px solid #ecd3b5;border-radius:999px;padding:1px 9px;margin-right:4px;color:#7a4b22}
.mohs i{width:16px;height:8px;border-radius:2px;background:#eadfd3}
.mohs i.on{background:linear-gradient(90deg,#e2c27d,#b98d3e)}
.map{width:100%;height:auto;border-radius:14px;background:linear-gradient(180deg,#e8f0f3,#dfe9ee);border:1px solid #d6e2e7}
.srclist{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.badge{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--gold);border-radius:999px;padding:3px 9px}
.mspill{flex-direction:column;align-items:stretch;gap:3px;padding:5px 12px;min-width:92px}
.mspill span{font-size:13px;line-height:1;white-space:nowrap}.mspill small{color:var(--muted);font-size:11px}
.mspill i{display:block;height:4px;border-radius:9px;background:#efe3d8;overflow:hidden}.mspill i b{display:block;height:100%;background:linear-gradient(90deg,#f2a7c3,#e2c27d);border-radius:9px;transition:width .4s}
.mscele{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:70px;animation:fade .3s}
.mscele.out{opacity:0;transition:opacity .3s}
.mscele .conf i{position:absolute;top:-30px;font-style:normal;font-size:20px;animation:fall 3s ease-in forwards;text-shadow:0 1px 2px rgba(0,0,0,.15)}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(260deg);opacity:.2}}
.mscard{pointer-events:auto;position:relative;background:linear-gradient(180deg,#fffaf6,#fdeff3);border:1px solid #f1d3dd;border-radius:24px;box-shadow:var(--shadow);padding:18px 22px;max-width:min(440px,92vw);text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.mscard h2{font-size:30px;color:var(--plum);margin:2px 0 8px}
.msrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.msrow>div{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.msrow>div>svg{width:62px;height:62px}.msrow .arrow{font-size:22px;color:#c99a4a}.msdress svg{width:90px;height:144px}
.msgems{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 10px}.msgems button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;font-size:11px;width:78px;cursor:pointer}.msgems svg{width:40px;height:40px}
.stagewrap.erasing svg.stage{touch-action:none;cursor:cell}
.stagewrap svg.stage{-webkit-touch-callout:none}
.toast button{margin-left:10px;background:#fff;color:var(--plum);border:none;border-radius:99px;padding:4px 12px;font-weight:700;cursor:pointer;pointer-events:auto}
.locked-chip{opacity:.5}
.ribbons{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.ribbons .sw.auto{background:conic-gradient(#f9c6d3,#c8b6e2,#a8d8ea,#fff1c1,#f9c6d3)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--plum);color:#fff;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:14px;max-width:92vw;text-align:center;animation:fade .25s}
.float{position:absolute;pointer-events:none;font-weight:700;color:var(--gold);font-size:15px;text-shadow:0 1px 0 #fff;animation:rise 1s ease-out forwards}
@keyframes rise{to{transform:translateY(-36px);opacity:0}}
.celebrate{text-align:center;padding:30px 24px}
.celebrate h2{font-size:42px;color:var(--plum)}
.celebrate .unl{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.celebrate .unl div{display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:18px;font-weight:700}
.celebrate .unl svg{width:90px;height:90px}
@media (max-width:1100px){.play{grid-template-columns:260px 1fr}.play .right{grid-column:1/-1}}
@media (max-width:400px){.brand{font-size:17px}}
@media (max-width:760px){
  .mspill{min-width:70px;padding:4px 8px}
  header.top{gap:6px;padding:8px 10px}.brand{font-size:19px;gap:5px}.pill{padding:6px 9px;font-size:13px}.iconbtn{min-width:34px;height:34px;padding:0 8px}
  .hero{grid-template-columns:1fr;min-height:auto;padding-top:8px}.hero-art{order:-1}.hero-art svg{width:min(260px,70%)}
  .menu-cards{grid-template-columns:1fr 1fr}
  .play{grid-template-columns:1fr}.play .left{order:2}.play .center{order:1}.play .right{order:3}
  .stagewrap svg.stage{max-height:62vh}
  .infocard{grid-template-columns:1fr}.infocard .gemside{border-radius:22px 22px 0 0}.infocard .gemside svg{width:170px;height:170px}

/* shared gem editing: remove by tap / long-press / right-click, eraser drag, clear all, undo. Never lowers S.placed. */
function gemEditor(stage,getList,h){
  const hist=[];let group=null;
  const ed={hist,
    pushAdd(q){hist.push({a:'add',q});if(hist.length>300)hist.shift();},
    pushAdds(qs){hist.push({a:'adds',qs});if(hist.length>300)hist.shift();},
    hit(p,pad){const l=getList();let bi=-1,bd=1e9;for(let i=l.length-1;i>=0;i--){const q=l[i];const d=Math.hypot(q.x-p.x,q.y-p.y)-q.s/2;if(d<bd){bd=d;bi=i;}}return bi>=0&&bd<=pad?bi:-1;},
    hitCenter(p){const l=getList();for(let i=l.length-1;i>=0;i--){const q=l[i];if(Math.hypot(q.x-p.x,q.y-p.y)<=Math.max(4,q.s*.38))return i;}return -1;},
    remove(i){const l=getList();const q=l.splice(i,1)[0];h.onRemove&&h.onRemove(q);const it={q,i};if(group)group.push(it);else hist.push({a:'del',items:[it]});stage.renderGems(l);h.changed();return q;},
    removeWithToast(i){ed.remove(i);AudioFX.soft();toastAct('Gem removed','Undo',()=>ed.undo());},
    eraseAt(p,ph){if(ph==='start')group=[];if(p){let i,guard=0;while((i=ed.hit(p,5))>=0&&guard++<20){ed.remove(i);AudioFX.soft();}}
      if(ph==='end'){const g=group;group=null;if(g&&g.length){hist.push({a:'del',items:g});toastAct(`Removed ${g.length} gem${g.length>1?'s':''}`,'Undo',()=>ed.undo());}}},
    clearAll(){const l=getList();if(!l.length)return;const items=[];while(l.length){const q=l.shift();h.onRemove&&h.onRemove(q);items.push({q,i:0});}
      hist.push({a:'del',items});stage.renderGems(l);h.changed();toastAct(`Cleared ${items.length} gems`,'Undo',()=>ed.undo(),7000);},
    undo(){const l=getList();const x=hist.pop();
      if(!x){const q=l.pop();if(!q)return false;h.onRemove&&h.onRemove(q);}
      else if(x.a==='add'){const i=l.lastIndexOf(x.q);if(i>=0){l.splice(i,1);h.onRemove&&h.onRemove(x.q);}}
      else if(x.a==='adds'){x.qs.forEach(q=>{const i=l.lastIndexOf(q);if(i>=0){l.splice(i,1);h.onRemove&&h.onRemove(q);}});}
      else for(let k=x.items.length-1;k>=0;k--){const it=x.items[k];l.splice(Math.min(it.i,l.length),0,it.q);h.onRestore&&h.onRestore(it.q);}
      stage.renderGems(l);h.changed();return true;}};
  stage.onErase=(p,ph)=>ed.eraseAt(p,ph);
  stage.onLongPress=p=>{const i=ed.hit(p,4);if(i>=0)ed.removeWithToast(i);};
  return ed;
}

  const order=()=>{const grid=$('#bookGrid');const cmp=BOOK_CMP[BOOK_F.sort]||BOOK_CMP.rarity;grid.classList.toggle('sort-hard',BOOK_F.sort==='hard'||BOOK_F.sort==='soft');
    $$('.ecard',grid).sort((a,b)=>cmp(GEM[a.dataset.g],GEM[b.dataset.g])||GEM[a.dataset.g].name.localeCompare(GEM[b.dataset.g].name)).forEach(b=>grid.appendChild(b));};
  $('#bookSort').onchange=e=>{BOOK_F.sort=e.target.value;order();};order();
  $('#bookQ').oninput=e=>{BOOK_F.q=e.target.value;apply();};
  $$('#bookSeg button').forEach(b=>b.onclick=()=>{BOOK_F.show=b.dataset.bf;$$('#bookSeg button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});apply();});
  apply();}
const BOOK_F={q:'',show:'all',sort:'rarity'};let BOOK_REFRESH=null;
const BOOK_SORTS=[['rarity','Rarity'],['name','A–Z'],['hard','Hardest first'],['soft','Softest first'],['colour','Colour']];
const hueKey=g=>g.c.s<20?1000+(100-g.c.l):g.c.h;
const BOOK_CMP={rarity:(a,b)=>a.value-b.value,name:(a,b)=>a.name.localeCompare(b.name),hard:(a,b)=>b.mohs-a.mohs,soft:(a,b)=>a.mohs-b.mohs,colour:(a,b)=>hueKey(a)-hueKey(b)};
/* ---------- gallery ---------- */
function screenGallery(){
  app().innerHTML=`<section class="screen"><div class="section-head"><div><div class="opt-label">My gallery</div><h2>${GALLERY.length} saved dress${GALLERY.length===1?'':'es'}</h2></div>
    <button class="btn primary" data-go="design">✂️ Create a new dress</button></div>
    ${GALLERY.length?'':'<p class="muted">Nothing here yet. Finish an atelier level or save a dress from the designer.</p>'}
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${GALLERY.map((d,i)=>`<div class="gcard" data-i="${i}"><div class="thumb">${dressSVG(d,{prefix:'gal'+i})}</div>
      <div class="meta"><div class="n">${esc(d.name)}</div><div class="small muted">${d.gems.length} gems · ${new Date(d.created).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}${d.minted?` · <a href="${esc(d.minted.url||'#')}" target="_blank" rel="noopener">✦ on Starknet</a>`:''}</div></div>
      <div class="acts"><button class="btn small" data-a="edit">Edit</button><button class="btn small" data-a="dup" title="Make a copy of this dress to try a variation" aria-label="Copy ${esc(d.name)}">📋 Copy</button><button class="btn small" data-a="png">⬇︎ PNG</button>${window.JD_STARKNET&&JD_STARKNET.enabled?'<button class="btn small gold" data-a="mint">✦ Mint</button><button class="btn small" data-a="agent" title="Copy a Starknet MCP tool call for an AI agent">🤖</button>':''}<button class="btn small" data-a="del" aria-label="Delete">🗑</button></div></div>`).join('')}</div></section>`;
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('.gcard').forEach(c=>{const d=GALLERY[+c.dataset.i];$$('[data-a]',c).forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='edit')go('design',{load:d});
    if(a==='dup'){const nm=copyName(d.name);const c=JSON.parse(JSON.stringify({name:nm,dress:d.dress,gems:d.gems,tier:d.tier}));
      Object.assign(c,{id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),created:Date.now(),from:'copy'});
      GALLERY.splice(GALLERY.indexOf(d),0,c);saveGallery();AudioFX.soft();screenGallery();toastAct(`Copied as “${nm}” 📋`,'Edit copy',()=>go('design',{load:c}));
      const f=$('.gcard[data-i="'+GALLERY.indexOf(c)+'"] [data-a="edit"]');f&&f.focus();}
    if(a==='png')downloadPNG(d);
    if(a==='mint')JD_STARKNET.mint(d);
    if(a==='agent')JD_STARKNET.agentCall(d);
    if(a==='del'&&confirm(`Delete “${d.name}” from your gallery?`)){GALLERY.splice(GALLERY.indexOf(d),1);saveGallery();if(S.draft.id===d.id){S.draft.id=null;save();}screenGallery();}});});
}
function copyName(n){const base=String(n||'My Dress').replace(/\s*\(copy(?: \d+)?\)$/,'').trim()||'My Dress';const names=new Set(GALLERY.map(x=>x.name));
  for(let k=1;k<100;k++){const tag=k===1?' (copy)':` (copy ${k})`;const nm=base.slice(0,31-tag.length).trim()+tag;if(!names.has(nm))return nm;}return base.slice(0,24)+' (copy)';}
/* ---------- PNG export ---------- */
async function downloadPNG(d){
  try{const svg=dressSVG(d,{prefix:'ex',width:800,caption:d.name});
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
    const cv=document.createElement('canvas');cv.width=800;cv.height=1280;cv.getContext('2d').drawImage(img,0,0,800,1280);URL.revokeObjectURL(url);
    const b=await new Promise(r=>cv.toBlob(r,'image/png'));const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(d.name||'jewel-dress').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()+'.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PNG downloaded ⬇︎');
  }catch(e){console.warn(e);toast('Sorry, the PNG could not be created in this browser');}
}
/* =====================================================================
   API for the optional Starknet layer (js/starknet.js)
   ===================================================================== */
window.JD_GAME={
  toast, gems:GEMS, gallery:()=>GALLERY,
  async fingerprint(d){const canon=JSON.stringify({dress:d.dress,gems:d.gems.map(q=>{const r=[q.g,Math.round(q.x*10),Math.round(q.y*10),q.s,q.t];if(q.c)r.push(q.c);return r;})});
    try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canon));return '0x'+[...new Uint8Array(buf)].slice(0,31).map(b=>b.toString(16).padStart(2,'0')).join('');}
    catch(e){let a=hashStr(canon),b=hashStr(canon+'#'),c=hashStr('#'+canon);return '0x'+[a,b,c].map(x=>x.toString(16).padStart(8,'0')).join('');}},
  nameFelt(n){const ascii=[...String(n||'')].filter(ch=>{const c=ch.charCodeAt(0);return c>=32&&c<127;}).slice(0,31);return ascii.length?'0x'+ascii.map(ch=>ch.charCodeAt(0).toString(16).padStart(2,'0')).join(''):'0x0';},
  gemMask(d){let m=0n;new Set(d.gems.map(q=>q.g)).forEach(id=>{if(GEM[id])m|=1n<<BigInt(GEM[id].idx%64);});return '0x'+m.toString(16);},
  markMinted(id,info){const r=GALLERY.find(x=>x.id===id);if(r){r.minted=info;saveGallery();if(SCREEN==='gallery')screenGallery();}},
  refresh(){if(SCREEN!=='play')go(SCREEN);},
  go:n=>go(n),
};

go('menu');
// Reduced motion: freeze SVG (SMIL) sparkle, glint and shimmer animations when the system asks for less motion
(function(){const mq=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');if(!mq)return;let obs=null;
  const pauseAll=()=>document.querySelectorAll('svg').forEach(v=>{if(v.pauseAnimations&&!v.ownerSVGElement)v.pauseAnimations();});
  const apply=()=>{if(mq.matches){pauseAll();if(!obs){obs=new MutationObserver(pauseAll);obs.observe(document.body,{childList:true,subtree:true});}}
    else{if(obs){obs.disconnect();obs=null;}document.querySelectorAll('svg').forEach(v=>{if(v.unpauseAnimations&&!v.ownerSVGElement)v.unpauseAnimations();});}};
  apply();if(mq.addEventListener)mq.addEventListener('change',apply);})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
